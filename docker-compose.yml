services:
  wiki:
    # bake 模式：全量构建发生在 docker build 阶段（旧容器保持在线），
    # 运行时镜像已含 public/ 产物，容器只做静态服务，切换窗口≈秒级
    build:
      context: .
    image: wiki-note:latest
    container_name: wiki-note
    restart: unless-stopped
    # 静态服务进程收到 SIGTERM 即退出，10s 足够
    stop_grace_period: 10s
    labels:
      # 镜像为本地构建（非 registry 拉取），交由 watchtower 管理只会反复 pull 失败
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "8826:8080"
    # 内容更新流程：git pull && docker compose up -d --build
    #   （新镜像在 docker build 期间全量构建，旧容器继续服务；切换后无需再构建）
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('node:http').get('http://127.0.0.1:8080/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      # 启动不再构建，几秒内即可就绪
      start_period: 10s
